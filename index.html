<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WavToFM</title>
    <link rel="stylesheet" href="html/style.css">
</head>

<body>
    <h1>WavToFM</h1>

    <div class="file-input-wrapper">
        <input type="file" id="wav-input" accept=".wav,.syx">
        <label for="wav-input" class="file-input-label" id="file-label">
            Select a .wav or .syx file
            <span class="file-name" id="file-name">No file chosen</span>
        </label>
    </div>

    <div id="progress-wrapper" style="display:none;">
        <div id="progress-bar">
            <div id="progress-fill"></div>
        </div>
        <div id="progress-label"></div>
    </div>

    <div id="night-sky"></div>

    <div id="imported-panel" class="imported-panel">
        <div class="imported-header" id="imported-header">
            <span class="imported-title">Imported</span>
            <span class="config-arrow" id="imported-arrow">▼</span>
        </div>
        <div class="imported-body" id="imported-body">
            <div id="tabs"></div>
            <div id="tab-content"></div>
        </div>
    </div>

    <div id="favorites-panel" class="favorites-panel" style="display:none;">
        <div class="favorites-header" id="fav-header">
            <span>Favorites (<span id="fav-count">0</span>)</span>
            <span class="config-arrow">▼</span>
        </div>
        <div class="favorites-body" id="fav-body"></div>
    </div>

    <div id="edit-panel" class="edit-panel">
        <div class="edit-header">
            <h3>Edit Patch</h3>
            <button class="edit-close-btn" id="edit-close" title="Close">×</button>
        </div>

        <div class="edit-modes">
            <button class="edit-mode-btn active" data-mode="morph">Morph</button>
            <button class="edit-mode-btn" data-mode="params">Params</button>
            <button class="edit-mode-btn" data-mode="random">Random</button>
        </div>

        <div id="edit-slot-area"></div>

        <div class="edit-slider-row" id="edit-slider-row">
            <label class="edit-slider-label" id="edit-slider-label">
                Distance: <span id="edit-slider-val">0.50</span>
            </label>
            <input type="range" id="edit-slider" min="-1" max="1" step="0.01" value="0.5" class="edit-slider">
            <div class="edit-slider-ticks">
                <span>−1</span><span>0</span><span>1</span>
            </div>
        </div>

        <div id="edit-params-area" style="display:none"></div>

        <div class="edit-actions">
            <button class="btn-edit-clear" id="edit-clear">Clear</button>
            <button class="btn-edit-primary" id="edit-go" disabled>Morph</button>
        </div>

        <div class="edit-status" id="edit-status"></div>
    </div>

    <div id="piano-dock"></div>

    <button id="clear-btn">Clear History</button>

    <footer>&copy; Alexey S. Kompaniets 2026</footer>

    <script type="module" src="html/app.js"></script>
</body>

</html>
